# ============================================================
#  NereusThrone  |  Developer: naook1/adityap
#  Teks GUI otomatis jadi small caps (small-caps.gui: true).
#  Matikan jika ingin tulis manual / pakai font biasa.
#  Warna: &a, &l, hex &#RRGGBB. Placeholder PAPI didukung di pesan join/leave.
# ============================================================
settings:
  prefix: "&#7FDBFF&lNEREUS &8» &r"

small-caps:
  gui: true        # judul menu, nama item, lore
  messages: false  # pesan chat

placeholders:
  afk-tag: "&7[AFK]"   # %nereus_afk%

# ---------------- JOIN / LEAVE ----------------
# Permission otomatis: nereus.join.<id> / nereus.leave.<id>  (atur lewat LuckPerms)
# Contoh: /lp group vip permission set nereus.join.vip true
# Bisa override dengan "permission: ..." ; kosongkan ("") = semua orang boleh.
join-leave:
  enabled: true

join-styles:
  default:
    name: "&7Default"
    material: PAPER
    description: ["&7Pesan join standar."]
    message: "&8[&a+&8] &f{player} &7bergabung."
    sound: ""
  vip:
    name: "&aVIP Arrival"
    material: EMERALD
    description: ["&7Khusus rank &aVIP&7+"]
    message: "&8[&a+&8] &a✦ %luckperms_prefix%&f{player} &7telah tiba!"
    sound: "entity.experience_orb.pickup"
  elite:
    name: "&bElite Entrance"
    material: DIAMOND
    description: ["&7Khusus rank &bElite&7+"]
    message: "&8[&b+&8] &b❖ &#7FDBFF{player} &bmemasuki Nereus dengan gagah!"
    sound: "entity.player.levelup"
  kaiser:
    name: "&6Kaiser Descent"
    material: GOLDEN_HELMET
    description: ["&7Khusus rank &6Kaiser"]
    message: "&6&l⚜ &e&lKAISER &6{player} &etelah turun ke Nereus! &6&l⚜"
    sound: "ui.toast.challenge_complete"
  emperor:
    name: "&d&lEmperor Throne"
    material: NETHERITE_HELMET
    description: ["&7Khusus rank &dEmperor"]
    message: "&5&l♛ &d&lEMPEROR &f{player} &dbangkit dari singgasana! &5&l♛"
    sound: "entity.ender_dragon.growl"

leave-styles:
  default:
    name: "&7Default"
    material: PAPER
    description: ["&7Pesan leave standar."]
    message: "&8[&c-&8] &f{player} &7keluar."
    sound: ""
  vip:
    name: "&aVIP Farewell"
    material: EMERALD
    description: ["&7Khusus rank &aVIP&7+"]
    message: "&8[&c-&8] &a✦ %luckperms_prefix%&f{player} &7pamit. Sampai jumpa!"
    sound: ""
  elite:
    name: "&bElite Exit"
    material: DIAMOND
    description: ["&7Khusus rank &bElite&7+"]
    message: "&8[&c-&8] &b❖ &#7FDBFF{player} &bmeninggalkan Nereus."
    sound: ""
  kaiser:
    name: "&6Kaiser Retreat"
    material: GOLDEN_HELMET
    description: ["&7Khusus rank &6Kaiser"]
    message: "&6&l⚜ &e&lKAISER &6{player} &emundur dari medan laga. &6&l⚜"
    sound: ""
  emperor:
    name: "&d&lEmperor Vanish"
    material: NETHERITE_HELMET
    description: ["&7Khusus rank &dEmperor"]
    message: "&5&l♛ &d&lEMPEROR &f{player} &dkembali ke kegelapan. &5&l♛"
    sound: "entity.wither.spawn"

# ---------------- AFK ----------------
afk:
  auto-afk-seconds: 300     # 0 = nonaktif auto AFK
  broadcast: true
  default-reason: "AFK"
  reward:
    enabled: true
    permission: ""          # kosong = semua pemain AFK dapat reward
    interval-minutes: 5     # reward tiap 5 menit AFK
    max-per-session: 0      # 0 = tak terbatas (isi mis. 12 untuk batasi)
    disabled-worlds: []
    money:                  # uang naik bertahap: base + (tahap-1)*increment, max cap
      base: 1000
      increment: 250
      max: 5000
    key:                    # tiap tahap, ada peluang dapat key (kalau gagal -> uang)
      enabled: true
      chance: 20            # persen
      # SESUAIKAN dengan command CrazyCrates di servermu!
      command: "crazycrates give virtual {crate} 1 {player}"
      pool:                 # nama crate : bobot (rate)
        common: 60
        rare: 30
        epic: 10

# ---------------- DAILY ----------------
daily:
  cooldown-hours: 24
  streak-reset-hours: 48    # lewat ini streak balik ke hari 1
  rewards:
    1: {display: "$2.000", icon: CHEST, money: 2000, commands: []}
    2: {display: "$3.000", icon: CHEST, money: 3000, commands: []}
    3: {display: "$4.000 + Key common", icon: CHEST, money: 4000, commands: ["crazycrates give virtual common 1 {player}"]}
    4: {display: "$5.000", icon: CHEST, money: 5000, commands: []}
    5: {display: "$6.000 + Key rare", icon: ENDER_CHEST, money: 6000, commands: ["crazycrates give virtual rare 1 {player}"]}
    6: {display: "$8.000", icon: ENDER_CHEST, money: 8000, commands: []}
    7: {display: "$15.000 + Key epic", icon: SHULKER_BOX, money: 15000, commands: ["crazycrates give virtual epic 1 {player}"]}

# ---------------- KITS ----------------
kits:
  playerkits:
    enabled: true
    command: "kit"          # command PlayerKits2 yang membuka menu kit
    material: CHEST
    name: "&6PlayerKits"
    lore: ["&7Buka menu kit utama server.", "&7(dikelola oleh PlayerKits2)"]
  list:                     # kit tambahan khas Nereus
    starter:
      name: "&aNereus Starter"
      material: IRON_SWORD
      permission: ""
      cooldown: 86400
      lore: ["&7Paket awal untuk petualang."]
      commands: ["give {player} bread 16", "give {player} iron_sword 1"]
    vip:
      name: "&bVIP Pack"
      material: DIAMOND_PICKAXE
      permission: "nereus.kit.vip"
      cooldown: 43200
      lore: ["&7Khusus rank VIP+"]
      commands: ["give {player} diamond 4", "give {player} golden_apple 2"]

